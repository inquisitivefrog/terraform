name: EKS Deploy and Cleanup
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform: deploy or cleanup'
        required: true
jobs:
  eks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq
    - name: Set up AWS CLI
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.0
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: v1.27.0
    - name: Run script
      run: |
        if [ "${{ github.event.inputs.action }}" == "deploy" ]; then
          ./scripts/ecommerce-k8s-deploy.sh
        elif [ "${{ github.event.inputs.action }}" == "cleanup" ]; then
          ./scripts/ecommerce-k8s-cleanup.sh
        else
          echo "Invalid action: ${{ github.event.inputs.action }}"
          exit 1
        fi
