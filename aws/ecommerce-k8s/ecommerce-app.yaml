apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/inquisitivefrog/apps.git
    targetRevision: main # Adjust if your branch is different (e.g., master)
    path: charts/ecommerce-app
    helm:
      releaseName: ecommerce-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
