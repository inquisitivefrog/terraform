replicaCount: 1
# What the app answers with (http-echo -text). Change it, push to main, and
# Argo CD rolls it out within about 3 minutes.
message: "hello from Argo CD (GitOps test 2026-10-23)"
image:
  repository: hashicorp/http-echo
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 5678
# Extra pod labels. The selector labels (app, app.kubernetes.io/name) are
# always added by the template; repeating them here duplicates YAML keys.
podLabels: {}
# http-echo is a single static binary: it needs no root, writable files or
# extra capabilities.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 32Mi
