# MySQL (Percona XtraDB Cluster behind HAProxy): TLS verified against the
# cluster's CA (VERIFY_CA; HAProxy passes TLS through to whichever node it
# picks, so the host name can't be checked). Times in UTC.
#
# Session settings: max_execution_time caps SELECTs only (MySQL has no
# statement timeout for writes); innodb_lock_wait_timeout caps lock waits.
# On the writer, wsrep_sync_wait=1 makes a read wait until this node has
# applied every transaction the cluster committed before it: after HAProxy
# moves the writer to another Galera node, a client still reads its own
# writes.
orders:
  writer:
    jdbc-url: jdbc:mysql://${ORDERS_WRITER_HOST}/${ORDERS_DATABASE}?sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=file:${ORDERS_TRUSTSTORE}&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=${ORDERS_TRUSTSTORE_PASSWORD}&connectTimeout=3000&socketTimeout=15000&rewriteBatchedStatements=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    connection-init-sql: SET SESSION max_execution_time = 5000, innodb_lock_wait_timeout = 5, wsrep_sync_wait = 1
  reader:
    jdbc-url: jdbc:mysql://${ORDERS_READER_HOST}/${ORDERS_DATABASE}?sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=file:${ORDERS_TRUSTSTORE}&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=${ORDERS_TRUSTSTORE_PASSWORD}&connectTimeout=3000&socketTimeout=15000&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    connection-init-sql: SET SESSION max_execution_time = 5000
