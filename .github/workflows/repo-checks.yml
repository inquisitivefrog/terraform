# Same checks as scripts/git-hooks/pre-commit, run by GitHub on every push and
# pull request, so they apply to every clone. Docs: docs/REPO_CHECKS.md
name: repo-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the gitleaks history scan

      - name: No tracked files that .gitignore excludes
        run: |
          ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$ignored" ]; then
            echo "::error::Tracked files that .gitignore excludes:"
            echo "$ignored"
            exit 1
          fi

      - name: gitleaks secret scan (all history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff .
