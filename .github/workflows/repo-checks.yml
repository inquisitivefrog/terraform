# Same checks as scripts/git-hooks/pre-commit, run by GitHub on every push and
# pull request, so they apply to every clone. Docs: docs/REPO_CHECKS.md
name: repo-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the gitleaks history scan

      - name: No tracked files that .gitignore excludes
        run: |
          ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$ignored" ]; then
            echo "::error::Tracked files that .gitignore excludes:"
            echo "$ignored"
            exit 1
          fi

      - name: gitleaks secret scan (all history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff .

  # Report only for now: findings are printed but never fail the run. Make a
  # step blocking (drop continue-on-error / soft-fail) once its count is 0.
  # Local equivalents: aws/README.aws.test.md
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure, private]
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: tflint (${{ matrix.cloud }})
        continue-on-error: true
        working-directory: ${{ matrix.cloud }}
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits fetching rulesets
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

      - name: trivy config (${{ matrix.cloud }})
        continue-on-error: true
        env:
          TRIVY_VERSION: 0.76.1
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz trivy
          ./trivy config --severity MEDIUM,HIGH,CRITICAL --exit-code 0 ${{ matrix.cloud }}

      - name: checkov (${{ matrix.cloud }})
        continue-on-error: true
        run: |
          pip install --quiet checkov==3.3.20
          checkov -d ${{ matrix.cloud }} --framework terraform --compact --quiet --soft-fail
